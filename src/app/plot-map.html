<div #mapFrame class="map-viewport" [class.map-interactive]="navigation"
  tabindex="0" role="region"
  aria-label="Tactical map. Drag to pan, pinch or use zoom buttons. Select a reference marker to edit.">
  <svg [attr.viewBox]="viewBox()" preserveAspectRatio="xMidYMid meet"
    class="plot-svg" role="group" aria-label="Iron Nest map with reference markers and observation reports"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="onPointerUp($event)"
    (wheel)="onWheel($event)">
    <defs><clipPath [attr.id]="clipId"><rect x="45" y="30" width="880" height="440"/></clipPath></defs>
    <rect x="45" y="30" width="880" height="440" fill="#16231c"/>
    @for(col of columns;track col;let i=$index){
      <line [attr.x1]="x(i)" [attr.x2]="x(i)" y1="30" y2="470" class="map-line"/>
      <text [attr.x]="x(i+.5)" y="21" text-anchor="middle" class="map-text">{{col}}</text>
    }
    @for(row of rows;track row){
      <line x1="45" x2="925" [attr.y1]="y(row-1)" [attr.y2]="y(row-1)" class="map-line"/>
      <text x="25" [attr.y]="y(row-.5)+4" class="map-text" text-anchor="middle">{{row}}</text>
    }
    <line x1="925" x2="925" y1="30" y2="470" class="map-line"/>
    <line x1="45" x2="925" y1="470" y2="470" class="map-line"/>
    <g [attr.clip-path]="'url(#'+clipId+')'">
      @for(obs of observations;track obs.id){
        @if(obs.type==='range'){
          <circle [attr.cx]="x(obs.source.x)" [attr.cy]="y(obs.source.y)"
            [attr.r]="obs.value*44" class="observation-circle"/>
        }@else if(obs.type==='bearing'){
          <line [attr.x1]="x(obs.source.x)" [attr.y1]="y(obs.source.y)"
            [attr.x2]="rayX(obs)" [attr.y2]="rayY(obs)" class="observation-line"/>
        }@else{
          <path [attr.d]="sectorPath(obs)" class="observation-sector"/>
        }
      }
      @for(marker of markers;track marker.id){
        <g class="map-point" role="button" tabindex="0"
          [attr.aria-label]="'Edit '+marker.name+' at '+marker.grid"
          (click)="selectMarker(marker.id)"
          (keydown.enter)="selectMarker(marker.id)"
          (keydown.space)="$event.preventDefault();selectMarker(marker.id)">
          <!-- The transparent circle is a larger touch target than the visual pin. -->
          <circle class="map-touch-target" [attr.cx]="x(marker.p.x)"
            [attr.cy]="y(marker.p.y)" r="17"/>
          <circle [attr.cx]="x(marker.p.x)" [attr.cy]="y(marker.p.y)"
            [attr.r]="marker.id===highlightId?13:9"
            [attr.fill]="marker.role==='nest'?'#efbc75':marker.role==='spotter'?'#8bbee1':marker.role==='reference'?'#e2ce97':'#f18a75'"
            stroke="#141b17" stroke-width="2"/>
          <text class="map-marker-text" [attr.x]="x(marker.p.x)+12"
            [attr.y]="y(marker.p.y)-9">
            {{navigation && viewportWidth()<700 ? marker.name : marker.name+' ('+marker.grid+')'}}
          </text>
        </g>
      }
    </g>
  </svg>
  @if(navigation){
    <div class="map-navigation" role="group" aria-label="Map navigation">
      <button type="button" (click)="zoomStep(1.4)" aria-label="Zoom in" title="Zoom in">+</button>
      <button type="button" (click)="zoomStep(1/1.4)" aria-label="Zoom out" title="Zoom out">−</button>
      <button type="button" class="map-fit" (click)="fitMap()" aria-label="Fit whole map" title="Fit whole map">FIT</button>
      <button type="button" class="map-nest" (click)="focusNest()" aria-label="Focus Iron Nest" title="Focus Iron Nest">⌖</button>
    </div>
    <div class="map-zoom-indicator" aria-live="off">{{zoomPercent()}}%</div>
  }
</div>
